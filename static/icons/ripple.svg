<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Ripple</title>
  <!-- Source of truth (centre) with a ripple spreading out; the yellow dot is a copy back in sync. No background:
       one mid blue with heavy strokes stays legible on light and dark surfaces. -->
  <circle cx="256" cy="256" r="56" fill="#1D7AFC"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#1D7AFC" stroke-width="40"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1D7AFC" stroke-width="36"/>
  <circle cx="404.5" cy="107.5" r="44" fill="#F5CD47" stroke="#1D7AFC" stroke-width="16"/>
</svg>
